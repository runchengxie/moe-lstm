name: parquet-loader

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # Pandas and pyarrow only. A full `uv sync` also installs TensorFlow,
      # which this check does not import.
      - name: Install loader dependencies
        run: |
          uv venv
          uv pip install "pandas==3.1.1" "pyarrow==26.0.1"

      - name: Byte-compile
        run: uv run --no-sync python -m py_compile price_data.py moe_lstm.py

      - name: Aggregate synthetic Hive bars
        run: uv run --no-sync python -m unittest tests.test_hive_daily_bars -v
