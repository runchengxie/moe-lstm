name: parquet-loader

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install loader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==3.1.1" "pyarrow==26.0.1"

      - name: Byte-compile
        run: python -m py_compile price_data.py moe_lstm.py

      - name: Aggregate synthetic Hive bars
        run: python -m unittest tests.test_hive_daily_bars -v
