name: smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile moe_lstm.py

      - name: Smoke train
        env:
          MOE_DATA_CSV: tests/fixtures/tiny_bars.csv
          MOE_EPOCHS: "1"
          MPLBACKEND: Agg
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python moe_lstm.py
