name: smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Byte-compile
        run: uv run python -m compileall -q src/moe_lstm

      - name: Smoke train
        env:
          MOE_DATA_CSV: tests/fixtures/tiny_bars.csv
          MOE_EPOCHS: "1"
          MPLBACKEND: Agg
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: uv run moe-lstm
